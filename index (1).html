<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI</title><style>body{font-family:Arial;background:#101820;color:#fff;text-align:center;padding-top:80px}button{padding:15px 25px;font-size:18px;background:#00c8ff;color:#fff;border:none;border-radius:8px}#result{margin-top:20px;color:yellow;font-size:20px}</style></head><body><h1>Nova AI</h1><p>Hello! I'm Nova.</p><button onclick="listen()">🎤 Talk to Nova</button><p id="result">Waiting for your voice...</p><script>
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.speak(u);}
function listen(){if(!("webkitSpeechRecognition" in window)){alert("Speech recognition is not supported.");return;}let r=new webkitSpeechRecognition();r.lang="en-US";r.interimResults=false;r.continuous=false;document.getElementById("result").innerHTML="🎤 Listening...";r.start();r.onresult=function(e){let text=e.results[0][0].transcript;let m=text.toLowerCase().trim();let reply="";if(m.includes("nova"))reply="Hello! I am here. How can I help you?";else if(m.includes("hello"))reply="Hello! Nice to meet you.";else if(m.includes("how are you"))reply="I am doing great. Thank you!";else if(m.includes("what is your name")||m.includes("your name"))reply="My name is Nova.";else if(m.includes("who are you"))reply="I am Nova, your AI assistant.";else if(m.includes("thank"))reply="You're welcome!";else if(m.includes("bye"))reply="Goodbye!";else reply="Sorry, I don't understand yet.";document.getElementById("result").innerHTML="You said: "+text+"<br><br>Nova: "+reply;speak(reply);};r.onerror=function(e){document.getElementById("result").innerHTML="Microphone error: "+e.error;}}
</script></body></html>
